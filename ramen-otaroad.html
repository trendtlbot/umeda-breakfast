<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梅田駅周辺 1000円以内バーガーランダムピックアップ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Meiryo", sans-serif;
    background: linear-gradient(135deg, #ff6b35, #f7931e, #ffcc00);
    min-height: 100vh;
    color: #333;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  header {
    background: #d62300;
    color: white;
    padding: 25px 20px;
    text-align: center;
  }
  header h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  header p {
    font-size: 0.95rem;
    opacity: 0.9;
  }
  .main {
    padding: 30px 25px;
  }
  .result-box {
    background: #fff8f0;
    border: 3px solid #ff6b35;
    border-radius: 16px;
    padding: 25px;
    text-align: center;
    margin-bottom: 25px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .result-box h2 {
    color: #d62300;
    font-size: 1.4rem;
    margin-bottom: 12px;
  }
  .result-box .place {
    font-size: 1.5rem;
    font-weight: bold;
    color: #222;
    margin-bottom: 8px;
  }
  .result-box .menu {
    font-size: 1.25rem;
    color: #444;
    margin-bottom: 6px;
  }
  .result-box .price {
    font-size: 1.8rem;
    font-weight: bold;
    color: #d62300;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.2rem;
    font-weight: bold;
    color: white;
    background: linear-gradient(90deg, #d62300, #ff6b35);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 30px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(214,35,0,0.4);
  }
  .btn:active {
    transform: translateY(0);
  }
  .info-section {
    margin-bottom: 25px;
  }
  .info-section h3 {
    font-size: 1.15rem;
    color: #d62300;
    border-bottom: 2px solid #ffcc00;
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .min-price {
    font-size: 1.3rem;
    font-weight: bold;
    color: #222;
    background: #fff3cd;
    padding: 12px 16px;
    border-radius: 10px;
    text-align: center;
  }
  .menu-list {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 10px;
  }
  .menu-list table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .menu-list th, .menu-list td {
    padding: 8px 6px;
    text-align: left;
    border-bottom: 1px solid #f0f0f0;
  }
  .menu-list th {
    background: #fff8f0;
    position: sticky;
    top: 0;
  }
  .menu-list tr:hover {
    background: #fff8f0;
  }
  footer {
    background: #f5f5f5;
    padding: 20px;
    font-size: 0.75rem;
    color: #666;
    line-height: 1.5;
    border-top: 1px solid #ddd;
  }
  footer p {
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍔 梅田駅周辺<br>1000円以内バーガー抽選</h1>
    <p>画像のワッパー系ミールに近いメニューをランダムピックアップ</p>
  </header>

  <div class="main">
    <div class="result-box" id="result">
      <p style="color:#888;">下のボタンを押してランダム抽選！</p>
    </div>

    <button class="btn" onclick="pickRandom()">🎲 ランダムにピックアップする</button>

    <div class="info-section">
      <h3>💰 最低価格（候補メニュー中）</h3>
      <div class="min-price" id="minPrice">計算中...</div>
    </div>

    <div class="info-section">
      <h3>📋 選ばれるメニュー一覧（1000円以内）</h3>
      <div class="menu-list">
        <table>
          <thead>
            <tr>
              <th>店舗</th>
              <th>メニュー</th>
              <th>価格</th>
            </tr>
          </thead>
          <tbody id="menuTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>
    <p><strong>このプロンプト自体の文字：</strong></p>
    <p>梅田駅周辺でこの料理を1000円以内で食える場所をランダムにピックアップしてメニューもランダムに選ぶHTMLサイトを作ってください 最低値と選ばれるメニュー一覧も確認できるようにして このプロンプト自体の文字をサイトの下部に貼って</p>
  </footer>
</div>

<script>
// 梅田駅周辺で1000円以内で食べられるハンバーガー系メニュー候補
// （価格は2026年10月時点の参考値。店舗・時期により変動あり）
const candidates = [
  // バーガーキング
  { place: "バーガーキング リンクス梅田店", menu: "ワッパーJr.セット", price: 600 },
  { place: "バーガーキング リンクス梅田店", menu: "スモーキーBBQワッパーJr.セット", price: 650 },
  { place: "バーガーキング リンクス梅田店", menu: "ハッシュ＆BBQバーガーセット", price: 600 },
  { place: "バーガーキング リンクス梅田店", menu: "フィッシュバーガーセット", price: 600 },
  { place: "バーガーキング リンクス梅田店", menu: "BBQレタスバーガーセット", price: 550 },
  { place: "バーガーキング リンクス梅田店", menu: "スモーキーテリヤキバーガーセット", price: 550 },
  { place: "バーガーキング リンクス梅田店", menu: "タルタルチキンバーガーセット", price: 550 },
  { place: "バーガーキング リンクス梅田店", menu: "マッシュルームワッパーJr.セット（割引後）", price: 790 },
  { place: "バーガーキング リンクス梅田店", menu: "チーズバーガーコンビ", price: 390 },
  { place: "バーガーキング リンクス梅田店", menu: "ワッパー単品", price: 690 },
  { place: "バーガーキング リンクス梅田店", menu: "ワッパーチーズ単品", price: 790 },
  { place: "バーガーキング 梅田茶屋町店", menu: "ワッパーJr.セット", price: 600 },
  { place: "バーガーキング 梅田茶屋町店", menu: "BBQレタスバーガーセット", price: 550 },
  { place: "バーガーキング 梅田茶屋町店", menu: "マッシュルームワッパーJr.セット（割引後）", price: 790 },
  { place: "バーガーキング 梅田茶屋町店", menu: "ワッパーチーズセット（クーポン利用例）", price: 790 },

  // マクドナルド
  { place: "マクドナルド 新梅田店など", menu: "ハンバーガーセット（セット500）", price: 500 },
  { place: "マクドナルド 新梅田店など", menu: "マックチキンセット（セット500）", price: 500 },
  { place: "マクドナルド 新梅田店など", menu: "マックポークセット（セット500）", price: 500 },
  { place: "マクドナルド 新梅田店など", menu: "てりやきマックバーガーセット", price: 670 },
  { place: "マクドナルド 新梅田店など", menu: "ダブルチーズバーガーセット", price: 740 },
  { place: "マクドナルド 新梅田店など", menu: "ビッグマックセット", price: 770 },
  { place: "マクドナルド 新梅田店など", menu: "フィレオフィッシュセット", price: 690 },
  { place: "マクドナルド 新梅田店など", menu: "エグチセット", price: 610 },

  // モスバーガー
  { place: "モスバーガー 大阪駅前第2ビル店など", menu: "モスバーガー昼割セット", price: 900 },
  { place: "モスバーガー 大阪駅前第2ビル店など", menu: "テリヤキバーガー昼割セット", price: 890 },
  { place: "モスバーガー 大阪駅前第2ビル店など", menu: "チキンバーガー昼割セット", price: 820 },
  { place: "モスバーガー 大阪駅前第2ビル店など", menu: "モスバーガー単品", price: 500 },
  { place: "モスバーガー 大阪駅前第2ビル店など", menu: "モスチーズバーガー単品", price: 540 },
  { place: "モスバーガー 大阪駅前第2ビル店など", menu: "テリヤキチキンバーガー単品", price: 510 },
];

function init() {
  // 最低価格を計算
  const min = Math.min(...candidates.map(c => c.price));
  document.getElementById("minPrice").textContent = min + "円（" + 
    candidates.filter(c => c.price === min).map(c => c.menu).join(" / ") + "）";

  // 一覧テーブル生成
  const tbody = document.getElementById("menuTableBody");
  candidates
    .sort((a, b) => a.price - b.price)
    .forEach(c => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${c.place}</td><td>${c.menu}</td><td>${c.price}円</td>`;
      tbody.appendChild(tr);
    });
}

function pickRandom() {
  const item = candidates[Math.floor(Math.random() * candidates.length)];
  const result = document.getElementById("result");
  result.innerHTML = `
    <h2>🎉 本日のランダムピック！</h2>
    <div class="place">${item.place}</div>
    <div class="menu">${item.menu}</div>
    <div class="price">${item.price}円</div>
  `;
}

init();
</script>
</body>
</html>
